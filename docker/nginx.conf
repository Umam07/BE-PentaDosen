server {
    listen ${PORT};
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 25M;

    # Logging to stdout & stderr for container log streaming
    access_log /dev/stdout;
    error_log /dev/stderr;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Security: deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: deny direct access to sensitive project files
    location ~* /(composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|README\.md) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # PHP-FPM FastCGI Pass
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 180;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }
}
